<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <defs>
    <!-- Smooth 3D Eggshell Base Gradient -->
    <radialGradient id="eggBaseGrad" cx="36%" cy="28%" r="68%" fx="28%" fy="22%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#fff6ee"/>
      <stop offset="55%" stop-color="#fce8d8"/>
      <stop offset="82%" stop-color="#eed0ba"/>
      <stop offset="100%" stop-color="#d6b095"/>
    </radialGradient>
    <!-- Soft Bounce Light from Grass Below -->
    <linearGradient id="ambientOcclusion" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%" stop-color="#5c361e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2d180b" stop-opacity="0.38"/>
    </linearGradient>
    <!-- Inner Rim Highlight -->
    <linearGradient id="rimLight" x1="0%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#472815" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Main Eggshell Body -->
  <path d="M 256,24 
           C 368,24 470,178 470,382 
           C 470,550 378,618 256,618 
           C 134,618 42,550 42,382 
           C 42,178 144,24 256,24 Z" 
        fill="url(#eggBaseGrad)"/>

  <!-- Ambient Occlusion & Bottom Shadow -->
  <path d="M 256,24 
           C 368,24 470,178 470,382 
           C 470,550 378,618 256,618 
           C 134,618 42,550 42,382 
           C 42,178 144,24 256,24 Z" 
        fill="url(#ambientOcclusion)"/>

  <!-- 3D Rim Lighting -->
  <path d="M 256,24 
           C 368,24 470,178 470,382 
           C 470,550 378,618 256,618 
           C 134,618 42,550 42,382 
           C 42,178 144,24 256,24 Z" 
        fill="url(#rimLight)"/>

  <!-- Subtle Shell Pore Texture Dots -->
  <g fill="#b88d70" opacity="0.22">
    <circle cx="340" cy="190" r="3.5"/>
    <circle cx="365" cy="215" r="2.2"/>
    <circle cx="390" cy="310" r="4"/>
    <circle cx="410" cy="390" r="3"/>
    <circle cx="370" cy="480" r="4.5"/>
    <circle cx="330" cy="520" r="2.8"/>
    <circle cx="140" cy="460" r="3.5"/>
    <circle cx="115" cy="370" r="2.5"/>
    <circle cx="185" cy="535" r="3.2"/>
  </g>
</svg>
