<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b90"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g transform="rotate(-15 50 50)" filter="url(#shadow)">
    <!-- Ticket Body -->
    <path d="M 20 30 L 80 30 C 80 40, 80 40, 80 44 C 74 44, 74 56, 80 56 L 80 70 L 20 70 C 20 56, 20 56, 20 56 C 26 56, 26 44, 20 44 Z" fill="url(#ticketGrad)" stroke="#ffe4e6" stroke-width="3"/>
    <!-- Dashed Line -->
    <line x1="60" y1="32" x2="60" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.8"/>
    <!-- Star Icon on Ticket -->
    <polygon points="40,38 43,47 52,47 45,53 48,62 40,56 32,62 35,53 28,47 37,47" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>